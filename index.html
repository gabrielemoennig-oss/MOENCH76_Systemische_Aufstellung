<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menschliche System-Aufstellung</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f7f8fa; color: #2d3748; overflow: hidden; }
    
    #sidebar { width: 360px; min-width: 360px; background: #ffffff; border-right: 1px solid #e2e8f0; padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
    h2 { font-size: 1.15rem; color: #1a202c; font-weight: 700; }
    .section { border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; background: #fcfdfd; }
    label { font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 5px; color: #4a5568; }
    input, select, textarea, button { width: 100%; padding: 8px 10px; margin-bottom: 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.85rem; }
    textarea { resize: vertical; min-height: 60px; font-family: inherit; }
    button { background: #2d3748; color: #fff; font-weight: 600; border: none; cursor: pointer; margin-bottom: 0; transition: background 0.2s; }
    button:hover { background: #1a202c; }
    button.primary { background: #3182ce; }
    button.primary:hover { background: #2b6cb0; }
    button.danger { background: #e53e3e; }
    button.danger:hover { background: #c53030; }
    
    #cy-container { flex-grow: 1; position: relative; height: 100%; }
    #cy { width: 100%; height: 100%; background: #ffffff; }
    #info-box { position: absolute; bottom: 20px; right: 20px; background: rgba(255, 255, 255, 0.95); border: 1px solid #e2e8f0; padding: 10px 14px; border-radius: 6px; font-size: 0.8rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .status-msg { font-size: 0.75rem; color: #3182ce; margin-top: 4px; display: none; font-weight: 600; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>Menschliche Aufstellung</h2>
    
    <!-- 1. Beteiligte / Rollen -->
    <div class="section">
      <label>1. Person, Thema oder Regel hinzufügen</label>
      <input type="text" id="node-name" placeholder="z. B. Ich, Vater, Schweigen, Familie">
      <label>Kategorie / Rolle</label>
      <select id="node-layer">
        <option value="kreis">Engster Kreis (Personen)</option>
        <option value="umfeld">Weiteres Umfeld / Beteiligte</option>
        <option value="regel">Feste Regel / Tabu / Muster</option>
        <option value="thema">Ort / Thema / Anlass</option>
      </select>
      <button onclick="addNode()">Hinzufügen</button>
    </div>

    <!-- 2. Dynamik / Verbindung -->
    <div class="section">
      <label>2. Beziehung / Verbindung setzen</label>
      <select id="edge-source"><option value="">Von wem / was...</option></select>
      <select id="edge-target"><option value="">Zu wem / was...</option></select>
      <label>Art des Umgangs</label>
      <select id="edge-type">
        <option value="neutral">Im Fluss / Normaler Kontakt</option>
        <option value="blockiert">Funkstille / Kontaktabbruch / Schweigen</option>
        <option value="bindend">Feste Erwartung / Verpflichtung</option>
        <option value="spannung">Spannung / Reibung / Konflikt</option>
      </select>
      <button onclick="addEdge()">Verbindung ziehen</button>
    </div>

    <!-- 3. Analyse übertragen -->
    <div class="section">
      <label>3. Was beschäftigt dich dabei?</label>
      <textarea id="system-context" placeholder="Beschreibe kurz die Alltagssituation, um die es geht..."></textarea>
      <button class="primary" onclick="generateAndCopyPrompt()">Frage & Bild an Gemini übergeben</button>
      <div id="status-msg" class="status-msg">Inhalt kopiert! Gemini öffnet sich...</div>
    </div>

    <!-- Zurücksetzen -->
    <button class="danger" onclick="clearAll()">Aufstellung leeren</button>
  </div>

  <div id="cy-container">
    <div id="cy"></div>
    <div id="info-box">Tipp: Du kannst alle Kreise und Kästchen frei mit der Maus anordnen.</div>
  </div>

  <script>
    const cy = cytoscape({
      container: document.getElementById('cy'),
      elements: [],
      style: [
        {
          selector: 'node',
          style: {
            'label': 'data(label)',
            'text-valign': 'center',
            'color': '#ffffff',
            'font-size': '12px',
            'text-outline-width': 1,
            'text-outline-color': '#2d3748',
            'background-color': '#4a5568',
            'width': '65px',
            'height': '65px'
          }
        },
        {
          selector: 'node[layer="kreis"]',
          style: { 'background-color': '#3182ce', 'shape': 'ellipse' }
        },
        {
          selector: 'node[layer="umfeld"]',
          style: { 'background-color': '#718096', 'shape': 'ellipse' }
        },
        {
          selector: 'node[layer="regel"]',
          style: { 'background-color': '#c53030', 'shape': 'round-rectangle', 'width': '80px', 'height': '50px' }
        },
        {
          selector: 'node[layer="thema"]',
          style: { 'background-color': '#d69e2e', 'shape': 'diamond', 'width': '65px', 'height': '65px' }
        },
        {
          selector: 'edge',
          style: {
            'width': 2,
            'line-color': '#a0aec0',
            'target-arrow-color': '#a0aec0',
            'target-arrow-shape': 'triangle',
            'curve-style': 'bezier',
            'label': 'data(typeLabel)',
            'font-size': '10px',
            'color': '#4a5568',
            'text-background-color': '#ffffff',
            'text-background-opacity': 0.85,
            'text-background-padding': '3px'
          }
        },
        {
          selector: 'edge[type="blockiert"]',
          style: { 'line-color': '#e53e3e', 'target-arrow-color': '#e53e3e', 'line-style': 'dashed', 'width': 2 }
        },
        {
          selector: 'edge[type="bindend"]',
          style: { 'line-color': '#2b6cb0', 'target-arrow-color': '#2b6cb0', 'width': 3 }
        },
        {
          selector: 'edge[type="spannung"]',
          style: { 'line-color': '#dd6b20', 'target-arrow-color': '#dd6b20', 'line-style': 'dotted', 'width': 3 }
        }
      ],
      layout: { name: 'preset' }
    });

    let nodeCount = 0;

    function addNode() {
      const nameInput = document.getElementById('node-name');
      const layerInput = document.getElementById('node-layer');
      const label = nameInput.value.trim();
      if (!label) return;

      nodeCount++;
      const id = 'node_' + nodeCount;
      
      const pan = cy.pan();
      const zoom = cy.zoom();
      const x = (-pan.x + 350 + ((nodeCount % 6) * 50)) / zoom;
      const y = (-pan.y + 200 + ((nodeCount % 6) * 35)) / zoom;

      cy.add({
        group: 'nodes',
        data: { id: id, label: label, layer: layerInput.value },
        position: { x: x, y: y }
      });

      updateSelectOptions();
      nameInput.value = '';
    }

    function addEdge() {
      const source = document.getElementById('edge-source').value;
      const target = document.getElementById('edge-target').value;
      const typeSelect = document.getElementById('edge-type');
      const type = typeSelect.value;
      const typeLabel = typeSelect.options[typeSelect.selectedIndex].text;

      if (!source || !target || source === target) return;

      cy.add({
        group: 'edges',
        data: {
          id: source + '_' + target + '_' + Date.now(),
          source: source,
          target: target,
          type: type,
          typeLabel: typeLabel
        }
      });
    }

    function updateSelectOptions() {
      const sourceSelect = document.getElementById('edge-source');
      const targetSelect = document.getElementById('edge-target');
      
      sourceSelect.innerHTML = '<option value="">Von wem / was...</option>';
      targetSelect.innerHTML = '<option value="">Zu wem / was...</option>';

      cy.nodes().forEach(node => {
        const id = node.id();
        const label = node.data('label');
        sourceSelect.innerHTML += `<option value="${id}">${label}</option>`;
        targetSelect.innerHTML += `<option value="${id}">${label}</option>`;
      });
    }

    function clearAll() {
      cy.elements().remove();
      nodeCount = 0;
      updateSelectOptions();
    }

    function generateAndCopyPrompt() {
      const context = document.getElementById('system-context').value.trim();
      const nodes = cy.nodes();
      const edges = cy.edges();

      if (nodes.length === 0) {
        alert("Bitte erstelle zuerst mindestens ein Element.");
        return;
      }

      let elementList = [];
      nodes.forEach(node => {
        const pos = node.position();
        let layerName = "Person";
        if (node.data('layer') === 'umfeld') layerName = "Umfeld";
        if (node.data('layer') === 'regel') layerName = "Regel/Muster";
        if (node.data('layer') === 'thema') layerName = "Thema/Ort";

        elementList.push(`- ${node.data('label')} (${layerName}, Position: X=${Math.round(pos.x)}, Y=${Math.round(pos.y)})`);
      });

      let relationList = [];
      edges.forEach(edge => {
        const sourceLabel = cy.getElementById(edge.data('source')).data('label');
        const targetLabel = cy.getElementById(edge.data('target')).data('label');
        relationList.push(`- ${sourceLabel} -> ${targetLabel} [Dynamik: ${edge.data('typeLabel')}]`);
      });

      const promptText = `Du bist ein nüchternes Beobachtungs- und Analysewerkzeug. 
Deine Analyse soll im Hintergrund präzise sein, aber menschlich, klar und alltagsnah klingen. Verwende keine abgehobenen Fachbegriffe.

SITUATION / KONTEXT:
${context || 'Keine zusätzliche Beschreibung eingegeben.'}

BETEILIGTE PERSONEN & ELEMENTE (mit räumlicher Nähe):
${elementList.join('\n')}

VERBINDUNGEN & UMGANG MITEINANDER:
${relationList.length > 0 ? relationList.join('\n') : 'Keine direkten Verbindungen eingezeichnet.'}

DEIN BLICK AUF DIESES BILD:
1. Wie stehen die Beteiligten zueinander (wer steht wem nahe, wer steht außen vor oder abseits)?
2. Welche unausgesprochenen Regeln, Erwartungen oder Blockaden wirken im Hintergrund und halten die Situation fest?
3. Was passiert ganz sachlich im Miteinander, wenn sich jemand anders verhält als gewohnt?`;

      navigator.clipboard.writeText(promptText).then(() => {
        const statusMsg = document.getElementById('status-msg');
        statusMsg.style.display = 'block';
        setTimeout(() => { statusMsg.style.display = 'none'; }, 4000);
        window.open('https://gemini.google.com', '_blank');
      }).catch(err => {
        console.error('Kopieren fehlgeschlagen: ', err);
      });
    }
  </script>
</body>
</html>
