<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Systemische Modellierung</title>
  <!-- Cytoscape.js für die interaktive Netzwerkgrafik -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background-color: #f4f6f8; color: #333; overflow: hidden; }
    
    /* Seitenleiste für Eingaben */
    #sidebar { width: 340px; background: #ffffff; border-right: 1px solid #e1e4e8; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
    h2 { font-size: 1.1rem; color: #1a1a1a; margin-bottom: 5px; }
    .section { border: 1px solid #e1e4e8; padding: 12px; border-radius: 6px; background: #fafbfc; }
    label { font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 4px; color: #444; }
    input, select, button { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }
    button { background: #24292e; color: #fff; font-weight: 600; border: none; cursor: pointer; margin-bottom: 0; }
    button:hover { background: #000; }
    
    /* Hauptbereich für das Canvas */
    #cy-container { flex-grow: 1; position: relative; height: 100%; }
    #cy { width: 100%; height: 100%; }
    
    /* Status- und Anweisungshinweis */
    #info-box { position: absolute; bottom: 20px; right: 20px; background: rgba(255, 255, 255, 0.9); border: 1px solid #ddd; padding: 10px 14px; border-radius: 6px; font-size: 0.8rem; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>System-Canvas</h2>
    
    <!-- 1. Element hinzufügen -->
    <div class="section">
      <label>1. Element / Rolle hinzufügen</label>
      <input type="text" id="node-name" placeholder="z. B. Vater, Kind, Grenze, Ressource">
      <label>System-Ebene</label>
      <select id="node-layer">
        <option value="kern">Kernsystem</option>
        <option value="kontext">Erweiterter Kontext</option>
        <option value="grenze">Systemgrenze / Invariante</option>
      </select>
      <button onclick="addNode()">Element erstellen</button>
    </div>

    <!-- 2. Beziehung verknüpfen -->
    <div class="section">
      <label>2. Kopplung / Beziehung</label>
      <select id="edge-source"><option value="">Quelle wählen...</option></select>
      <select id="edge-target"><option value="">Ziel wählen...</option></select>
      <label>Kopplungstyp</label>
      <select id="edge-type">
        <option value="funktional">Funktional / Neutral</option>
        <option value="blockiert">Blockiert / Kommunikationsstopp</option>
        <option value="loyalitaet">Hierarchisch / Bindend</option>
        <option value="konflikt">Spannungsfeld</option>
      </select>
      <button onclick="addEdge()">Verbindung herstellen</button>
    </div>

    <!-- 3. System löschen -->
    <button style="background: #cf222e;" onclick="clearAll()">Alles zurücksetzen</button>
  </div>

  <div id="cy-container">
    <div id="cy"></div>
    <div id="info-box">Knoten können frei mit der Maus verschoben werden.</div>
  </div>

  <script>
    // Initialisierung Cytoscape Graph
    const cy = cytoscape({
      container: document.getElementById('cy'),
      elements: [],
      style: [
        {
          selector: 'node',
          style: {
            'label': 'data(label)',
            'text-valign': 'center',
            'color': '#ffffff',
            'font-size': '12px',
            'text-outline-width': 1,
            'text-outline-color': '#333',
            'background-color': '#4a5568',
            'width': '50px',
            'height': '50px'
          }
        },
        {
          selector: 'node[layer="kern"]',
          style: { 'background-color': '#2b6cb0' }
        },
        {
          selector: 'node[layer="kontext"]',
          style: { 'background-color': '#4a5568' }
        },
        {
          selector: 'node[layer="grenze"]',
          style: { 'background-color': '#c53030', 'shape': 'rectangle' }
        },
        {
          selector: 'edge',
          style: {
            'width': 2,
            'line-color': '#a0aec0',
            'target-arrow-color': '#a0aec0',
            'target-arrow-shape': 'triangle',
            'curve-style': 'bezier'
          }
        },
        {
          selector: 'edge[type="blockiert"]',
          style: { 'line-color': '#e53e3e', 'target-arrow-color': '#e53e3e', 'line-style': 'dashed' }
        },
        {
          selector: 'edge[type="loyalitaet"]',
          style: { 'line-color': '#2b6cb0', 'target-arrow-color': '#2b6cb0', 'width': 3 }
        },
        {
          selector: 'edge[type="konflikt"]',
          style: { 'line-color': '#dd6b20', 'target-arrow-color': '#dd6b20', 'line-style': 'zigzag' }
        }
      ],
      layout: { name: 'preset' }
    });

    let nodeCount = 0;

    function addNode() {
      const nameInput = document.getElementById('node-name');
      const layerInput = document.getElementById('node-layer');
      const label = nameInput.value.trim();
      if (!label) return;

      nodeCount++;
      const id = 'node_' + nodeCount;
      
      // Platzierung leicht versetzt im Zentrum
      const pan = cy.pan();
      const zoom = cy.zoom();
      const x = (-pan.x + 400 + (nodeCount * 30)) / zoom;
      const y = (-pan.y + 300 + (nodeCount * 20)) / zoom;

      cy.add({
        group: 'nodes',
        data: { id: id, label: label, layer: layerInput.value },
        position: { x: x, y: y }
      });

      updateSelectOptions();
      nameInput.value = '';
    }

    function addEdge() {
      const source = document.getElementById('edge-source').value;
      const target = document.getElementById('edge-target').value;
      const type = document.getElementById('edge-type').value;

      if (!source || !target || source === target) return;

      cy.add({
        group: 'edges',
        data: {
          id: source + '_' + target + '_' + Date.now(),
          source: source,
          target: target,
          type: type
        }
      });
    }

    function updateSelectOptions() {
      const sourceSelect = document.getElementById('edge-source');
      const targetSelect = document.getElementById('edge-target');
      
      sourceSelect.innerHTML = '<option value="">Quelle wählen...</option>';
      targetSelect.innerHTML = '<option value="">Ziel wählen...</option>';

      cy.nodes().forEach(node => {
        const id = node.id();
        const label = node.data('label');
        sourceSelect.innerHTML += `<option value="${id}">${label}</option>`;
        targetSelect.innerHTML += `<option value="${id}">${label}</option>`;
      });
    }

    function clearAll() {
      cy.elements().remove();
      nodeCount = 0;
      updateSelectOptions();
    }
  </script>
</body>
</html>
